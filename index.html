:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 30px #0f172a0a}.area-card{cursor:pointer;transition:.2s}.area-card:hover{transform:translateY(-3px);box-shadow:0 15px 35px #0f172a18}.area-card .icon{font-size:32px}.area-card h3{margin:8px 0 4px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.select,.input{padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;width:auto}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.topic{padding:16px;border:1px solid var(--line);border-radius:16px;background:white;cursor:pointer}.topic:hover{border-color:#93c5fd;background:#eff6ff}.lesson{background:#fff;border-radius:24px;border:1px solid var(--line);padding:28px;box-shadow:0 12px 40px #0f172a0a}.lesson h1{font-size:36px}.lesson h2{margin-top:30px}.lesson img{max-width:100%;border-radius:18px}.video{position:relative;padding-top:56.25%;margin:18px 0;border-radius:18px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.question{border:1px solid var(--line);padding:18px;border-radius:16px;margin:14px 0;background:#fff}.option{display:block;padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option:hover{background:#f8fafc}.result{padding:18px;border-radius:16px;background:#eff6ff;border:1px solid #bfdbfe;margin-top:16px}.score{font-size:42px;font-weight:900}.profile{display:grid;grid-template-columns:.7fr 1.3fr;gap:18px}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.stat{font-size:28px;font-weight:900}.notice{padding:14px;border-left:4px solid var(--warm);background:#fffbeb;border-radius:10px}.auth{max-width:520px;margin:30px auto}.hidden{display:none!important}footer{text-align:center;color:var(--muted);padding:28px;border-top:1px solid var(--line);background:#fff}.back{margin-bottom:15px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.topics{grid-template-columns:repeat(2,1fr)}.hero,.profile{grid-template-columns:1fr}.top{gap:10px;flex-wrap:wrap}.user-badge{display:none}}@media(max-width:600px){.grid,.topics{grid-template-columns:1fr}.top nav{width:100%;justify-content:center}.hero{padding:20px}.lesson{padding:20px}}

const AREAS=[

{id:'fis',name:'Física',icon:'⚡',desc:'Movimiento, fuerzas, energía, ondas, electricidad y modelación.',img:'https://images.unsplash.com/photo-1636466497217-26a8cbeaf0aa?auto=format&fit=crop&w=1200&q=80',topics:['Movimiento','Fuerzas y leyes de Newton','Energía','Electricidad y ondas']},
{id:'qui',name:'Química',icon:'⚗️',desc:'Materia, átomo, enlaces, reacciones, soluciones y análisis químico.',img:'https://images.unsplash.com/photo-1532634922-8fe0b757fb13?auto=format&fit=crop&w=1200&q=80',topics:['Materia y átomo','Enlaces químicos','Reacciones químicas','Soluciones y concentración']}

const BASE={
'Matemáticas|Números y operaciones':{concept:'Los números son modelos que permiten representar cantidades, ordenar magnitudes y describir relaciones. Trabajar este tema implica comprender el significado de las operaciones y elegir el procedimiento adecuado según el contexto. Los enteros permiten representar ganancias y pérdidas; las fracciones y decimales permiten expresar partes de una unidad; las razones comparan cantidades y los porcentajes expresan una relación respecto de cien. No basta con ejecutar una operación: es necesario interpretar el resultado y verificar si tiene sentido.',deep:'En la resolución de problemas conviene identificar datos, magnitudes, relación entre ellas, operación necesaria y unidad de respuesta. Las propiedades conmutativa, asociativa y distributiva permiten transformar expresiones sin cambiar su valor. Las fracciones pueden compararse mediante denominadores comunes, equivalencias o representación gráfica. En porcentajes, un aumento del p% se modela multiplicando por 1+p/100 y una disminución por 1-p/100.',examples:['Un descuento del 20% sobre $150.000 equivale a pagar $120.000.','Si 3 de cada 5 estudiantes entregan una actividad, la razón 3:5 representa la relación entre quienes entregaron y el total.'],activity:'Una familia dispone de $480.000 para alimentación y usa el 35%. ¿Cuánto gastó y cuánto le quedó? Explica el procedimiento.',qs:[['Un artículo cuesta $200.000 y aumenta 15%. ¿Cuál es el nuevo precio?',['$215.000','$225.000','$230.000','$240.000'],2],['Si 3/4 de una cantidad son 36, la cantidad es:',['27','42','48','54'],2]]},
'Matemáticas|Álgebra y funciones':{concept:'El álgebra permite representar relaciones generales mediante símbolos. Una expresión algebraica combina números, variables y operaciones; una ecuación afirma que dos expresiones tienen el mismo valor y una función relaciona valores de entrada con valores de salida siguiendo una regla. El objetivo escolar no es manipular letras por rutina, sino interpretar qué representa cada símbolo y qué significa una solución en el contexto.',deep:'Para resolver una ecuación se aplican transformaciones equivalentes a ambos lados. En una función lineal de la forma y=mx+b, m representa la tasa de cambio y b el valor inicial. Las tablas, gráficas, ecuaciones y situaciones verbales son distintas representaciones de una misma relación. Una buena respuesta debe poder traducirse entre estas representaciones.',examples:['El costo de un taxi puede modelarse como tarifa fija más costo por kilómetro.','En una gráfica lineal, una pendiente positiva indica que la variable de salida aumenta cuando aumenta la entrada.'],activity:'Una empresa cobra $8.000 de tarifa fija y $2.500 por cada kilómetro. Construye la expresión del costo para x kilómetros y calcula el costo de 6 km.',qs:[['Si y=3x+2, ¿cuál es y cuando x=4?',['10','12','14','16'],2],['En y=5x−1, el número 5 representa:',['El valor inicial','La pendiente o tasa de cambio','La solución','El dominio completo'],1]]},
'Matemáticas|Geometría y medición':{concept:'La geometría estudia propiedades, relaciones y medidas de figuras y espacios. Comprender área, perímetro y volumen exige reconocer qué magnitud se está midiendo, qué unidades corresponden y qué información proporciona la figura. Las fórmulas son herramientas que deben surgir de las relaciones geométricas, no listas para memorizar sin comprender.',deep:'El perímetro mide longitud alrededor de una figura; el área mide superficie y el volumen mide espacio ocupado. En un rectángulo A=base×altura. El triángulo puede entenderse como la mitad de un rectángulo con la misma base y altura, por lo que A=base×altura/2. La semejanza permite establecer proporciones entre figuras y el teorema de Pitágoras relaciona los lados de un triángulo rectángulo mediante a²+b²=c².',examples:['Un rectángulo de 8 m por 5 m tiene área 40 m² y perímetro 26 m.','En un triángulo rectángulo con catetos 6 y 8, la hipotenusa mide 10.'],activity:'Diseña un jardín rectangular de 12 m por 7 m. Calcula área y perímetro e indica cuántos metros de cerca necesitas.',qs:[['Un triángulo tiene base 10 cm y altura 6 cm. Su área es:',['16 cm²','30 cm²','60 cm²','120 cm²'],1],['Si un cuadrado duplica su lado, su área:',['Se duplica','Se triplica','Se cuadruplica','No cambia'],2]]},
'Matemáticas|Estadística y probabilidad':{concept:'La estadística permite recolectar, organizar, representar e interpretar datos para tomar decisiones. La media, mediana y moda resumen distribuciones, pero no siempre dicen lo mismo. La probabilidad cuantifica qué tan posible es un evento bajo un modelo determinado. Interpretar una gráfica exige observar escalas, unidades, tendencias y posibles sesgos.',deep:'La media se obtiene sumando los datos y dividiendo entre el número de observaciones; la mediana es el valor central al ordenar los datos; la moda es el valor más frecuente. Para eventos igualmente probables, P(A)=casos favorables/casos posibles. La probabilidad de un evento y su complemento suman 1. En situaciones reales hay que distinguir asociación de causalidad y considerar el tamaño y la forma de la muestra.',examples:['En 2,4,4,5,10 la moda es 4 y la mediana es 4.','Al lanzar un dado justo, P(obtener 2 o 4)=2/6=1/3.'],activity:'Una encuesta registra 12, 15, 18, 15 y 20 minutos de estudio diario. Calcula media, mediana y moda.',qs:[['Para los datos 2,4,4,5,10, la mediana es:',['2','4','5','10'],1],['La probabilidad de obtener cara al lanzar una moneda equilibrada es:',['0','1/4','1/2','1'],2]]},
'Biología|La célula':{concept:'La célula es la unidad estructural y funcional de los seres vivos. El material de Docente Belkis presenta la teoría celular y señala que los organismos están constituidos por células, que en ellas ocurren reacciones metabólicas, que las células proceden de otras células y que contienen material hereditario. Comprender la célula exige relacionar estructura y función: una membrana regula intercambios, el núcleo eucariota contiene gran parte del ADN y las mitocondrias participan en la obtención de energía.',deep:'Las células procariotas no poseen un núcleo delimitado por membrana, mientras las eucariotas sí. En células vegetales se encuentran estructuras como pared celular y cloroplastos. La membrana plasmática presenta permeabilidad selectiva; por difusión las partículas se desplazan según gradientes de concentración y por ósmosis se mueve agua a través de una membrana semipermeable. La especialización celular permite que células con el mismo material genético cumplan funciones diferentes.',examples:['Una célula vegetal realiza fotosíntesis en cloroplastos.','Una célula muscular necesita una elevada producción de ATP para sostener la contracción.'],activity:'Observa una célula eucariota y explica qué estructuras esperarías encontrar y qué función cumple cada una.',qs:[['¿Cuál afirmación pertenece a la teoría celular?',['Los virus son células','Las células provienen de células preexistentes','Solo los animales poseen células','Toda célula tiene cloroplastos'],1],['Si una célula pierde su membrana plasmática, se altera principalmente:',['El control de intercambio con el medio','La forma de los cromosomas','La secuencia del ADN','El número de especies'],0]]},
'Biología|Genética y herencia':{concept:'La genética estudia cómo se almacena, expresa y transmite la información hereditaria. El ADN contiene genes y los genes pueden presentar variantes llamadas alelos. Durante la reproducción sexual, la meiosis produce gametos y contribuye a la variabilidad genética. Las leyes de Mendel ayudan a predecir la transmisión de ciertos caracteres bajo modelos simplificados.',deep:'Es importante diferenciar gen, alelo, genotipo y fenotipo. Un individuo puede ser homocigoto cuando posee dos alelos iguales para un gen y heterocigoto cuando son diferentes. En un cruce Aa×Aa, el modelo mendeliano clásico produce una proporción genotípica 1 AA : 2 Aa : 1 aa. La expresión fenotípica depende de las relaciones de dominancia consideradas y, en organismos reales, puede intervenir una red compleja de factores genéticos y ambientales.',examples:['Dos progenitores heterocigotos Aa pueden tener descendencia aa con probabilidad 1/4 en el modelo clásico.','Una mutación modifica la secuencia de ADN y puede ser neutra, perjudicial o, en ciertos contextos, ventajosa.'],activity:'Construye un cuadro de Punnett para Aa×Aa y explica qué significan las cuatro combinaciones.',qs:[['En Aa×Aa, la probabilidad de aa es:',['0%','25%','50%','75%'],1],['Una mutación es:',['Siempre perjudicial','Un cambio en el material genético','Una enfermedad obligatoria','Una forma de reproducción'],1]]},
'Biología|Evolución':{concept:'La evolución biológica describe cambios heredables en las poblaciones a través de generaciones. El material de Docente Belkis explica que la variabilidad genética surge, entre otros mecanismos, por mutaciones y recombinación, y que la selección natural modifica la proporción de variantes en las poblaciones. La selección actúa sobre individuos, pero el cambio evolutivo se observa en la población.',deep:'Para que opere la selección natural deben existir variación entre individuos, diferencias en supervivencia o reproducción y herencia de parte de las características relevantes. Una característica no se vuelve adaptativa porque el organismo la necesite conscientemente. La adaptación es el resultado histórico de procesos poblacionales. Mutación, recombinación, selección, deriva genética y flujo génico pueden modificar la composición genética de una población.',examples:['Si una variante heredable aumenta la supervivencia en un ambiente, sus portadores pueden dejar más descendencia y la variante aumentar su frecuencia.','El cambio de una población no significa que cada individuo se transforme durante su vida.'],activity:'Explica por qué decir “los individuos evolucionan porque necesitan adaptarse” es una explicación incorrecta.',qs:[['Según la selección natural, lo que cambia evolutivamente es principalmente:',['Una necesidad individual','La población y sus frecuencias genéticas','El ambiente por voluntad del organismo','Una especie durante una sola vida'],1],['Una fuente de variabilidad genética es:',['Mutación','Memorización','Ejercicio físico','Aprendizaje escolar'],0]]},
'Biología|Ecosistemas y ambiente':{concept:'Un ecosistema integra una comunidad de seres vivos y los factores físicos con los que interactúa. Los organismos ocupan roles, establecen relaciones y participan en flujos de materia y energía. Comprender un ecosistema requiere distinguir factores bióticos y abióticos, niveles tróficos, cadenas y redes alimentarias y ciclos de nutrientes.',deep:'La energía entra principalmente a través de productores fotosintéticos y se transfiere entre niveles tróficos con pérdidas. La materia, en cambio, circula mediante ciclos como los del carbono y nitrógeno. Una alteración ambiental puede producir efectos en cascada: eliminar un depredador, introducir una especie o reducir un recurso puede cambiar abundancias y relaciones. El análisis ambiental debe considerar evidencia y escalas temporales.',examples:['La disminución de productores reduce la energía disponible para consumidores.','La contaminación de un río puede afectar organismos, cadenas alimentarias y comunidades humanas.'],activity:'Construye una red alimentaria sencilla de un ecosistema colombiano e identifica productores, consumidores y descomponedores.',qs:[['¿Cuál es un factor abiótico?',['Competencia','Temperatura','Depredación','Parasitismo'],1],['En una cadena alimentaria, los productores:',['Obtienen energía de otros animales','Capturan energía y generan materia orgánica','Solo descomponen restos','Siempre son consumidores secundarios'],1]]},
'Sociales|Historia de Colombia':{concept:'La historia de Colombia se estudia como un proceso en el que interactúan actores, instituciones, territorios, economía, cultura y conflictos. Una explicación histórica seria no consiste en memorizar fechas aisladas: exige ubicar hechos en su contexto, comparar fuentes, identificar causas y consecuencias y reconocer que un mismo proceso puede ser interpretado desde perspectivas diferentes.',deep:'Para analizar una fuente se pregunta quién la produjo, cuándo, para qué, qué afirma y qué información omite. Las causas pueden ser múltiples y pertenecer a distintos niveles. Una consecuencia no siempre es inmediata. En Colombia, procesos como la Independencia, la formación republicana, la violencia política, la Constitución de 1991 y las transformaciones económicas deben estudiarse relacionando acontecimientos con estructuras sociales y territoriales.',examples:['Una fuente oficial y un testimonio de una comunidad pueden ofrecer perspectivas distintas sobre un mismo hecho.','La Constitución de 1991 puede analizarse en relación con cambios institucionales y participación ciudadana.'],activity:'Elige un proceso histórico colombiano y escribe dos causas, dos consecuencias y una fuente que podría ayudarte a estudiarlo.',qs:[['Para evaluar una fuente histórica es especialmente importante conocer:',['Solo su fecha','Autor, contexto, propósito y evidencia','La opinión más popular','Solo el título'],1],['Una explicación histórica sólida debe:',['Usar una sola causa','Relacionar evidencias y contexto','Evitar comparar fuentes','Ignorar perspectivas'],1]]},
'Sociales|Geografía humana':{concept:'La geografía humana estudia cómo las sociedades ocupan, transforman y organizan el espacio. Población, migración, urbanización, actividades económicas y desigualdades territoriales se relacionan con factores físicos, políticos, culturales y económicos. Los mapas y estadísticas son herramientas para interpretar estas relaciones.',deep:'La densidad de población no es lo mismo que población total. Migrar implica cambiar de lugar de residencia y puede responder a factores de expulsión y atracción. La urbanización transforma el territorio y puede generar oportunidades y problemas de movilidad, vivienda, servicios y ambiente. Leer un mapa requiere revisar escala, orientación, leyenda, variables representadas y fuente de los datos.',examples:['Dos ciudades con igual población pueden tener densidades muy diferentes si sus superficies son distintas.','Una sequía puede funcionar como factor de expulsión mientras el empleo puede actuar como factor de atracción.'],activity:'Analiza un mapa de población de Colombia e identifica una concentración urbana y una posible explicación.',qs:[['La densidad de población relaciona:',['Población y superficie','Clima y relieve','Exportaciones y PIB','Edad y alfabetización'],0],['Un factor de atracción migratoria puede ser:',['Desempleo','Conflicto','Oportunidades laborales','Desastres'],2]]},
'Sociales|Ciudadanía y democracia':{concept:'La ciudadanía democrática implica participar en decisiones colectivas, reconocer derechos y responsabilidades y resolver desacuerdos mediante reglas legítimas. Democracia no significa simplemente votar: también comprende deliberación, control ciudadano, pluralismo, igualdad ante la ley y protección de derechos.',deep:'Los mecanismos de participación permiten intervenir en asuntos públicos. La separación de poderes busca evitar la concentración de autoridad y crear controles. En una sociedad democrática, una decisión mayoritaria no justifica automáticamente vulnerar derechos fundamentales. El análisis ciudadano debe distinguir intereses, argumentos, normas y consecuencias.',examples:['Una comunidad puede usar mecanismos de participación para plantear una necesidad ante autoridades.','Un debate democrático debe permitir argumentos y réplica, no solo imponer la opinión de la mayoría.'],activity:'Analiza un problema de tu comunidad y propone un mecanismo democrático para participar en su solución.',qs:[['Una característica esencial de la democracia es:',['Concentración del poder','Participación y control ciudadano','Ausencia de normas','Decisiones sin debate'],1],['Si una mayoría propone eliminar un derecho fundamental de una minoría, debe considerarse:',['Correcto solo por ser mayoría','El límite de los derechos y principios constitucionales','Irrelevante','Una decisión privada'],1]]},
'Sociales|Economía y sociedad':{concept:'La economía estudia cómo las personas y sociedades organizan recursos limitados para satisfacer necesidades. Conceptos como producción, consumo, precios, empleo, inflación y distribución permiten interpretar situaciones económicas. Las decisiones económicas generan beneficios y costos y afectan de manera diferente a grupos sociales.',deep:'La escasez obliga a elegir. El costo de oportunidad es aquello a lo que se renuncia al escoger una alternativa. Los precios pueden transmitir información sobre oferta y demanda, pero los mercados reales están influidos por instituciones, regulación, poder de mercado y externalidades. La inflación es un aumento sostenido del nivel general de precios, no simplemente que un producto específico se encarezca.',examples:['Si una familia gasta más en transporte, puede reducir el dinero disponible para otra necesidad: existe un costo de oportunidad.','Una externalidad ocurre cuando una actividad afecta a terceros sin quedar plenamente reflejada en el precio.'],activity:'Describe una decisión económica cotidiana, identifica las alternativas y explica su costo de oportunidad.',qs:[['El costo de oportunidad es:',['El precio de todo','La mejor alternativa a la que se renuncia','Un impuesto obligatorio','La cantidad de dinero ahorrada'],1],['La inflación se refiere a:',['La caída de un solo precio','El aumento generalizado y sostenido de precios','El aumento de salarios únicamente','El crecimiento de la población'],1]]},
'Castellano|Oración y texto':{concept:'La oración organiza palabras alrededor de relaciones sintácticas y comunica una idea con sentido. El material de Docente Belkis presenta la oración como un conjunto de palabras con sentido completo y al menos un verbo conjugado, y distingue oraciones simples y compuestas. Para comprender textos también es necesario reconocer cómo las oraciones se conectan mediante mecanismos de cohesión y cómo cada elección lingüística aporta al sentido global.',deep:'El sujeto se relaciona con aquello de lo que se habla y el predicado expresa lo que se afirma sobre ese sujeto. Las oraciones compuestas contienen más de un núcleo verbal conjugado y pueden establecer relaciones de coordinación o subordinación. En un texto, conectores como porque, sin embargo, por tanto y aunque orientan las relaciones lógicas entre ideas. La coherencia depende de que las ideas mantengan una relación temática y lógica.',examples:['“María estudia cada tarde” contiene un verbo conjugado y comunica una proposición completa.','“Estudió, pero no presentó el examen” coordina dos proposiciones mediante “pero”.'],activity:'Subraya sujeto, verbo y predicado en tres oraciones y después une dos de ellas mediante un conector adecuado.',qs:[['¿Qué ayuda a reconocer una oración según el material?',['No tener verbo','Expresar sentido completo y presentar verbo conjugado','Tener solo dos palabras','No usar conectores'],1],['En “Estudió, pero no presentó el examen”, “pero” expresa:',['Causa','Contraste','Tiempo','Finalidad'],1]]},
'Castellano|Comprensión lectora':{concept:'Comprender un texto implica mucho más que localizar palabras. El lector debe identificar información explícita, relacionar partes, inferir significados y evaluar la forma y el contenido. Este enfoque coincide con la competencia de Lectura Crítica del ICFES, que incluye identificar y ubicar información, relacionar e interpretar y evaluar y reflexionar sobre textos.',deep:'Una estrategia eficaz consiste en identificar propósito, tesis o idea central, argumentos, evidencias y relaciones entre párrafos. Las inferencias deben estar apoyadas por el texto; no son simples opiniones personales. Para evaluar una afirmación conviene preguntar qué evidencia la respalda, qué supuestos contiene y qué información adicional sería necesaria. La comprensión crítica también considera tono, estructura y recursos retóricos.',examples:['Si un autor presenta datos para defender una conclusión, el lector debe relacionar esos datos con la tesis.','Una inferencia válida puede combinar dos afirmaciones explícitas del texto para obtener una conclusión implícita.'],activity:'Lee un artículo breve y escribe idea central, dos evidencias, una inferencia y una pregunta crítica.',qs:[['Una inferencia válida debe:',['Contradecir el texto','Apoyarse en información del texto','Depender solo de experiencias personales','Ignorar el contexto'],1],['Evaluar críticamente un texto implica:',['Solo resumirlo','Analizar forma, contenido, argumentos y evidencias','Memorizarlo','Contar sus palabras'],1]]},
'Castellano|Literatura':{concept:'La literatura utiliza el lenguaje con intención estética, simbólica y cultural. Los géneros narrativo, lírico y dramático organizan distintas formas de construir mundos, voces y conflictos. Analizar una obra supone atender al contexto, narrador, personajes, tiempo, espacio, recursos expresivos y temas, evitando reducirla a una simple lista de datos biográficos.',deep:'En narrativa, el narrador puede participar o no en la historia y su perspectiva condiciona la información. En poesía, imágenes, metáforas, ritmo y voz lírica construyen significados. En teatro, el diálogo y las acotaciones organizan la acción escénica. Una interpretación literaria debe sostenerse en elementos concretos del texto y puede admitir más de una lectura si está argumentada.',examples:['Una metáfora relaciona elementos sin usar necesariamente “como”, creando un sentido figurado.','Cambiar el narrador puede modificar lo que el lector sabe sobre un personaje.'],activity:'Selecciona un cuento o poema colombiano e identifica género, voz, tema, dos recursos literarios y una interpretación sustentada.',qs:[['Una interpretación literaria sólida debe:',['Ser una opinión sin evidencia','Apoyarse en elementos del texto','Repetir la biografía del autor','Ignorar el contexto'],1],['En una narración, el narrador cumple la función de:',['Organizar la voz desde la que se cuenta la historia','Ser siempre el autor real','Eliminar los personajes','Definir el precio del libro'],0]]},
'Castellano|Producción escrita':{concept:'Escribir bien implica planear, redactar, revisar y reescribir. Un texto efectivo tiene propósito, destinatario, estructura, coherencia, cohesión y corrección lingüística. La escritura académica requiere distinguir afirmaciones de evidencias y utilizar conectores para hacer explícitas las relaciones entre ideas.',deep:'La planificación responde qué quiero comunicar, a quién y con qué propósito. En la redacción se organiza la información en una secuencia comprensible. La revisión permite detectar repeticiones, contradicciones, saltos lógicos, errores gramaticales y problemas de puntuación. Reescribir no significa copiar de nuevo: significa tomar decisiones para mejorar el texto.',examples:['Una opinión argumentada necesita razones y, cuando es posible, evidencias.','Un párrafo eficaz desarrolla una idea central y conecta las oraciones con relaciones claras.'],activity:'Escribe un párrafo argumentativo sobre el uso responsable del celular en clase. Después revisa tesis, razones, conector y conclusión.',qs:[['La primera fase recomendable de un texto académico es:',['Publicar','Planificar propósito, destinatario y contenido','Borrar todo','Memorizar conectores'],1],['La revisión busca principalmente:',['Evitar pensar en el contenido','Mejorar claridad, coherencia, cohesión y corrección','Cambiar siempre el tema','Aumentar palabras sin propósito'],1]]},
'Inglés|Basic communication':{concept:'Basic communication develops the ability to exchange simple information about identity, routines, preferences, places and needs. At beginner level, the priority is understanding the meaning of common expressions and producing short, accurate messages in context. Vocabulary is learned more effectively when connected to situations rather than isolated lists.',deep:'Common communicative functions include introducing yourself, asking and answering personal questions, describing routines, giving directions and expressing likes. Pronouns, the verb be, have, common question words and basic present forms provide the structure for these exchanges. The learner should pay attention to subject–verb agreement and word order in questions.',examples:['“What is your name?” — “My name is Laura.”','“Where do you live?” — “I live in Santa Marta.”'],activity:'Write a six-line dialogue in English introducing yourself, asking where someone lives and describing one daily activity.',qs:[['Choose the correct sentence:',['She live in Colombia.','She lives in Colombia.','She living Colombia.','She does lives Colombia.'],1],['“Where do you live?” asks about:',['Age','Place of residence','Occupation','Favorite food'],1]]},
'Inglés|Grammar in context':{concept:'Grammar is useful because it makes meaning more precise. In context, learners need to recognize who performs an action, when it occurs and whether a statement is affirmative, negative or interrogative. The present simple is commonly used for routines and facts, while the present continuous describes actions happening around the moment of speaking.',deep:'In the present simple, third-person singular commonly takes -s: “He works”. Questions use do/does: “Does she study?”. In the present continuous, the verb be combines with the -ing form: “They are studying”. Understanding the time reference of a sentence is more important than memorizing isolated rules.',examples:['“I study every day” describes a routine.','“I am studying now” describes an action in progress.'],activity:'Write three sentences about your routine and two about what you are doing now. Then convert one sentence into a question.',qs:[['Which sentence describes a routine?',['I am eating now.','I eat breakfast at 7.','I am eating breakfast.','I eating breakfast.'],1],['Choose the correct question:',['Does she works here?','Do she work here?','Does she work here?','She does work here?'],2]]},
'Inglés|Reading comprehension':{concept:'Reading in English requires identifying explicit information, understanding relationships and using context to infer meaning. A learner does not need to translate every word. Titles, cognates, repeated vocabulary, connectors and surrounding sentences provide clues. The goal is to construct meaning from the whole text.',deep:'A useful sequence is preview, identify purpose, locate key information, infer and verify. Words such as because, but, however and therefore signal relationships. When a word is unknown, examine its grammatical role and the information around it before reaching for a dictionary. Multiple-choice questions should be answered from evidence in the passage.',examples:['“Although it was raining, they went outside” signals contrast through although.','A repeated noun across several sentences is often central to the topic.'],activity:'Read a short English paragraph and identify topic, one explicit fact, one inference and two unknown words whose meanings you can infer.',qs:[['If a text says “Ana was tired, but she finished the task”, “but” signals:',['Cause','Contrast','Sequence','Place'],1],['A good reading strategy is to:',['Translate every word first','Use context and identify key information','Ignore the title','Choose the longest option'],1]]},
'Inglés|Everyday English':{concept:'Everyday English focuses on practical communication: shopping, asking for information, schedules, food, transportation and simple social exchanges. Meaning depends on context, politeness and common expressions. Learners should recognize functional phrases and respond appropriately rather than only translate individual words.',deep:'Expressions such as “Could you help me?”, “How much is it?”, “What time does it start?” and “I would like…” are useful because they perform communicative functions. Countable and uncountable nouns affect expressions with some, any, much and many. Time and place expressions also help interpret everyday notices and conversations.',examples:['“How much is this shirt?” asks for a price.','“Could you tell me where the station is?” is a polite request for information.'],activity:'Create a short dialogue between a customer and a shop assistant using price, quantity and a polite request.',qs:[['“How much is it?” asks about:',['Quantity of countable items','Price','Time','Distance'],1],['Which is a polite request?',['Give me water.','Water!','Could you give me some water, please?','I want water now.'],2]]},
'Filosofía|Qué es filosofar':{concept:'Filosofar es adoptar una actitud reflexiva y crítica frente a problemas que afectan nuestra comprensión del mundo. El material de Docente Belkis explica que la filosofía no se reduce a acumular definiciones: implica aprender a interrogar, examinar supuestos y justificar respuestas. También presenta la admiración, la duda y las situaciones límite como fuentes del filosofar.',deep:'La filosofía se caracteriza por ser racional, crítica, problemática, metódica y sistemática. Su carácter crítico no significa negar todo, sino examinar razones y supuestos. Un problema filosófico puede no tener una respuesta definitiva, pero sí exige argumentos claros. La filosofía dialoga con ciencias, religión y otras formas de saber sin confundirse con ellas.',examples:['Preguntar qué hace justa una norma es distinto de memorizar una definición de justicia.','Dudar de una creencia puede llevar a investigar qué razones la sostienen.'],activity:'Formula una pregunta filosófica sobre libertad, justicia o verdad y escribe dos posibles posiciones argumentadas.',qs:[['Filosofar implica principalmente:',['Memorizar autores','Examinar problemas mediante razones','Aceptar toda autoridad','Evitar preguntas'],1],['Una actitud crítica consiste en:',['Repetir una afirmación','Analizar razones y supuestos','Rechazar evidencia','Elegir según popularidad'],1]]},
'Filosofía|Epistemología':{concept:'La epistemología o teoría del conocimiento estudia cómo conocemos, qué podemos conocer y qué justifica una creencia. El material distingue la reflexión epistemológica sobre diferentes ciencias y relaciona el conocimiento con problemas de razón, experiencia, evidencia y justificación. La pregunta central no es solo “¿qué sé?”, sino “¿por qué considero que lo sé?”.',deep:'Una creencia puede ser verdadera por casualidad y, sin embargo, no estar bien justificada. En investigación, la evidencia debe ser pertinente y evaluarse críticamente. Razón y experiencia pueden cumplir funciones diferentes según el problema. El pensamiento científico incorpora procedimientos de contrastación y revisión, mientras la epistemología analiza los fundamentos y límites de esas formas de conocer.',examples:['Una predicción confirmada repetidamente por evidencia es más defendible que una afirmación basada en una sola anécdota.','Distinguir opinión de conocimiento requiere preguntar por las razones y evidencias disponibles.'],activity:'Elige una afirmación cotidiana y construye un pequeño mapa: afirmación → evidencia → posible objeción → conclusión provisional.',qs:[['La epistemología estudia principalmente:',['El conocimiento y su justificación','Solo la moral','Solo el arte','El clima'],0],['Una afirmación está mejor justificada cuando:',['Es popular','Cuenta con razones y evidencia pertinentes','La dice una persona famosa','No admite preguntas'],1]]},
'Filosofía|Ética y axiología':{concept:'La ética reflexiona sobre la acción humana, el bien, el deber, la responsabilidad y los criterios para evaluar decisiones. La axiología estudia los valores. Analizar un dilema ético exige distinguir hechos, valores, intereses, normas y consecuencias. No toda preferencia personal constituye un argumento ético.',deep:'En un dilema pueden entrar en tensión valores legítimos. Una argumentación ética debe explicar por qué una acción es defendible y considerar a quién afecta. Las teorías éticas ofrecen marcos diferentes: algunas enfatizan deberes, otras consecuencias y otras virtudes. Estudiarlas permite comparar razones, no aprender una respuesta única para todos los casos.',examples:['Decidir si ocultar información para proteger a alguien puede enfrentar el valor de la honestidad con el de la protección.','Una consecuencia positiva no convierte automáticamente cualquier medio en moralmente aceptable.'],activity:'Analiza un dilema escolar: un estudiante descubre que su amigo copia en un examen. Expón dos posiciones y justifícalas.',qs:[['Un análisis ético debe considerar:',['Solo gustos','Hechos, valores, normas, razones y consecuencias','Solo castigos','Solo la opinión de la mayoría'],1],['La axiología se relaciona con:',['El estudio de los valores','El movimiento','La gramática','La geología'],0]]},
'Filosofía|Antropología filosófica':{concept:'La antropología filosófica pregunta qué significa ser humano y cómo se relacionan libertad, razón, cuerpo, cultura, sociedad y sentido de la vida. A diferencia de una descripción exclusivamente biológica, busca discutir conceptualmente las dimensiones que constituyen nuestra experiencia humana.',deep:'Las distintas concepciones del ser humano tienen consecuencias éticas y políticas. Si una teoría entiende al individuo como esencialmente libre, planteará preguntas distintas a una teoría que destaque determinaciones sociales o históricas. La reflexión filosófica compara estas perspectivas y examina sus argumentos.',examples:['La pregunta “¿somos libres?” puede relacionarse con responsabilidad moral.','La cultura modifica formas de lenguaje, normas y prácticas, pero también puede ser transformada por las personas.'],activity:'Escribe una definición provisional de “ser humano” y después presenta una objeción a tu propia definición.',qs:[['La antropología filosófica estudia principalmente:',['Qué significa ser humano','Solo la anatomía','Solo los animales','Las operaciones aritméticas'],0],['Una pregunta antropológica sería:',['¿Qué es la responsabilidad humana?','¿Cuánto mide un triángulo?','¿Cuál es la fórmula del agua?','¿Qué día es hoy?'],0]]},
'Física|Movimiento':{concept:'Describir movimiento exige elegir un sistema de referencia y distinguir posición, distancia, desplazamiento, rapidez, velocidad y aceleración. La cinemática estudia cómo cambia el movimiento sin explicar inicialmente sus causas. Las gráficas posición-tiempo y velocidad-tiempo permiten representar esos cambios.',deep:'La rapidez media relaciona distancia total y tiempo total. La velocidad incorpora dirección. En movimiento rectilíneo uniforme la velocidad es constante y la posición cambia linealmente. En movimiento uniformemente acelerado la velocidad cambia de manera constante. Las unidades deben mantenerse coherentes y el resultado debe interpretarse físicamente.',examples:['Recorrer 120 km en 2 h corresponde a una rapidez media de 60 km/h.','Una pendiente en una gráfica posición-tiempo representa velocidad cuando los ejes están correctamente definidos.'],activity:'Un ciclista recorre 30 km en 1,5 h. Calcula rapidez media y explica qué información adicional necesitarías para conocer su velocidad media.',qs:[['La rapidez media se calcula como:',['Tiempo/distancia','Distancia/tiempo','Masa/volumen','Fuerza/área'],1],['En una gráfica posición-tiempo, una pendiente constante indica:',['Velocidad constante','Masa constante','Fuerza nula siempre','Temperatura constante'],0]]},
'Física|Fuerzas y leyes de Newton':{concept:'Las fuerzas describen interacciones capaces de modificar el movimiento o producir deformaciones. Las leyes de Newton permiten relacionar fuerzas netas con aceleración, masa e interacción entre cuerpos. Para resolver problemas es esencial identificar el sistema, dibujar fuerzas relevantes y distinguir fuerza neta de cada fuerza individual.',deep:'La primera ley expresa la inercia: si la fuerza neta es cero, un cuerpo mantiene su estado de movimiento. La segunda establece ΣF=ma. La tercera señala que las fuerzas aparecen en pares de interacción iguales en magnitud y opuestos en dirección, actuando sobre cuerpos diferentes. Peso, normal, fricción y tensión deben interpretarse según el contexto.',examples:['Si una fuerza neta de 20 N actúa sobre 5 kg, la aceleración es 4 m/s².','Peso y normal pueden tener igual magnitud en reposo sobre una superficie horizontal, pero no son un par de tercera ley.'],activity:'Dibuja el diagrama de fuerzas de un libro en reposo sobre una mesa y explica por qué su aceleración es cero.',qs:[['Según ΣF=ma, si ΣF=12 N y m=3 kg, a es:',['2 m/s²','3 m/s²','4 m/s²','36 m/s²'],2],['Las fuerzas de acción y reacción actúan:',['Sobre el mismo cuerpo','Sobre cuerpos diferentes','Siempre en la misma dirección','Solo cuando hay movimiento'],1]]},
'Física|Energía':{concept:'La energía es una magnitud que permite analizar transformaciones y transferencias. En mecánica aparecen energía cinética, asociada al movimiento, y potencial gravitatoria, asociada a la posición en un campo gravitatorio. El trabajo describe transferencia de energía mediante una fuerza con desplazamiento.',deep:'La energía cinética es Ec=1/2 mv² y la potencial gravitatoria cerca de la superficie terrestre es Ep=mgh. En sistemas ideales la energía mecánica puede conservarse; en sistemas reales parte puede transformarse en energía térmica, sonora u otras formas. Analizar energía evita seguir cada fuerza durante todo el movimiento cuando basta con comparar estados.',examples:['Si se duplica la velocidad, la energía cinética se cuadruplica.','Al elevar un objeto aumenta su energía potencial gravitatoria.'],activity:'Compara la energía cinética de un automóvil a 20 km/h y a 40 km/h con la misma masa. Explica la relación.',qs:[['Si la velocidad se duplica, Ec:',['Se duplica','Se triplica','Se cuadruplica','No cambia'],2],['La energía potencial gravitatoria aumenta cuando:',['Disminuye la altura','Aumenta la altura','Disminuye la masa a cero','No hay gravedad'],1]]},
'Física|Electricidad y ondas':{concept:'La electricidad estudia cargas, corriente, diferencia de potencial y resistencia. La ley de Ohm relaciona estas magnitudes mediante V=IR para ciertos materiales y condiciones. Las ondas transportan energía e información mediante oscilaciones; frecuencia, longitud de onda, amplitud y velocidad describen sus características.',deep:'En un circuito, una diferencia de potencial puede impulsar corriente a través de una resistencia. En serie la corriente es común y las resistencias se suman; en paralelo la diferencia de potencial es común en ramas ideales. Para ondas se cumple v=fλ. La frecuencia indica ciclos por unidad de tiempo y no debe confundirse con amplitud.',examples:['Con 12 V y 4 Ω, la corriente es 3 A.','Si una onda tiene f=5 Hz y λ=2 m, su velocidad es 10 m/s.'],activity:'Analiza un circuito sencillo con una batería de 9 V y una resistencia de 3 Ω. Calcula la corriente y explica qué representa.',qs:[['Con V=12 V y R=4 Ω, I es:',['1 A','2 A','3 A','48 A'],2],['Si f=5 Hz y λ=2 m, v es:',['2,5 m/s','7 m/s','10 m/s','25 m/s'],2]]},
'Química|Materia y átomo':{concept:'La materia posee propiedades que permiten describirla y clasificarla. Las sustancias pueden ser elementos o compuestos, mientras las mezclas contienen dos o más sustancias que conservan sus identidades químicas. El modelo atómico explica la estructura interna mediante núcleo y electrones y ha evolucionado con la evidencia experimental.',deep:'Los protones tienen carga positiva, los electrones negativa y los neutrones no tienen carga eléctrica neta. El número atómico identifica un elemento porque corresponde al número de protones. Los isótopos tienen igual número de protones y diferente número de neutrones. Las propiedades periódicas dependen de la estructura electrónica.',examples:['Un átomo con 6 protones es carbono, independientemente de su número de neutrones.','Agua pura es un compuesto; aire es una mezcla de gases.'],activity:'Clasifica agua destilada, aire, hierro y agua con sal como elemento, compuesto o mezcla y justifica cada decisión.',qs:[['El número atómico corresponde al número de:',['Neutrones','Protones','Moléculas','Niveles'],1],['Los isótopos de un elemento tienen diferente número de:',['Protones','Neutrones','Elementos','Cargas del núcleo'],1]]},
'Química|Enlaces químicos':{concept:'Los enlaces químicos explican cómo los átomos se mantienen unidos en sustancias. La formación de enlaces está relacionada con la distribución de electrones de valencia y con la búsqueda de configuraciones de menor energía. Los enlaces iónico, covalente y metálico describen modelos diferentes de interacción.',deep:'En un enlace iónico se forman iones por transferencia de electrones y la atracción electrostática organiza una red. En el covalente se comparten pares de electrones; puede ser polar o no polar según la diferencia de electronegatividad. En metales, electrones deslocalizados ayudan a explicar conductividad y maleabilidad. La estructura determina propiedades macroscópicas.',examples:['NaCl puede entenderse como una red de iones Na+ y Cl−.','En H₂O los enlaces O–H son covalentes polares y la geometría molecular contribuye a su comportamiento.'],activity:'Compara NaCl y H₂O: tipo de enlace predominante, partículas presentes y una propiedad relacionada.',qs:[['El enlace covalente implica principalmente:',['Compartir electrones','Destruir electrones','Eliminar protones','Compartir neutrones'],0],['Una propiedad característica de muchos metales es:',['Baja conductividad','Conductividad eléctrica','Ausencia de electrones','Imposibilidad de deformarse'],1]]},
'Química|Reacciones químicas':{concept:'Una reacción química transforma unas sustancias en otras mediante reorganización de átomos. Los reactivos se convierten en productos, pero los átomos se conservan. Una ecuación química representa el proceso y debe balancearse para respetar la conservación de la materia.',deep:'Balancear no significa cambiar subíndices de las fórmulas, sino ajustar coeficientes. Las reacciones pueden clasificarse como síntesis, descomposición, desplazamiento y combustión, entre otras. Evidencias como formación de gas, precipitado, cambio de temperatura o color pueden indicar reacción, pero deben interpretarse junto con el contexto.',examples:['2H₂ + O₂ → 2H₂O conserva cuatro átomos de H y dos de O a ambos lados.','En una combustión de un hidrocarburo se forman típicamente CO₂ y H₂O con oxígeno suficiente.'],activity:'Balancea Fe + O₂ → Fe₂O₃ y verifica que el número de átomos sea igual en ambos lados.',qs:[['Al balancear una ecuación se deben conservar:',['Solo las moléculas','Los átomos de cada elemento','Los colores','Las temperaturas'],1],['¿Cuál es una posible evidencia de reacción química?',['Cambio de fase siempre','Formación de un precipitado','Cortar papel','Cambiar de recipiente'],1]]},
'Química|Soluciones y concentración':{concept:'Una solución es una mezcla homogénea formada por soluto y solvente. La concentración cuantifica cuánto soluto hay respecto de una cantidad de solución o solvente. Comprender concentración permite preparar soluciones, comparar muestras e interpretar procesos químicos y biológicos.',deep:'Una forma sencilla de concentración es porcentaje masa/volumen, que expresa gramos de soluto por cada 100 mL de solución. También se usa molaridad, M=moles de soluto/L de solución. Al diluir una solución, la cantidad de soluto se conserva si no hay pérdida, mientras aumenta el volumen y disminuye la concentración.',examples:['5 g de sal en 100 mL de solución corresponden a 5% m/v.','Si una solución se diluye al doble de volumen manteniendo los moles, su molaridad se reduce a la mitad.'],activity:'Calcula el porcentaje m/v de una solución con 8 g de soluto en 200 mL de solución.',qs:[['8 g en 200 mL corresponden a:',['2% m/v','4% m/v','8% m/v','16% m/v'],1],['Al diluir sin perder soluto, la concentración:',['Aumenta','Disminuye','No puede cambiar','Se vuelve cero'],1] ]}
};
const GENERIC={
'8°-9°':'En este nivel se prioriza construir conceptos, interpretar situaciones sencillas, usar representaciones y explicar procedimientos con lenguaje propio. La meta es pasar de la definición al uso del conocimiento en ejemplos escolares y cotidianos.',
'10°-11°':'En este nivel se profundiza el análisis, la argumentación y la transferencia a situaciones nuevas. Se espera comparar explicaciones, interpretar datos, justificar decisiones y resolver problemas con mayor autonomía, en línea con el enfoque competencial del ICFES.'};
function getLesson(area,topic,grade){const b=BASE[area+'|'+topic];return b||{concept:`${topic} es un componente fundamental de ${area}. En esta lección se estudia su significado, sus conceptos relacionados y la manera de aplicarlos en situaciones concretas.`,deep:`El aprendizaje de ${topic} requiere identificar conceptos centrales, establecer relaciones entre ellos y utilizarlos para explicar o resolver situaciones. La comprensión se comprueba cuando el estudiante puede justificar una respuesta, interpretar información y reconocer cuándo un procedimiento es apropiado.`,examples:[`Aplicación escolar de ${topic} mediante una situación contextualizada.`,`Comparación de dos casos para identificar cómo cambia la respuesta cuando cambian los datos.`],activity:`Explica ${topic} con tus propias palabras, construye un ejemplo y escribe una pregunta que te gustaría investigar.`,qs:[[`¿Qué demuestra mejor comprensión de ${topic}?`,['Repetir una definición sin contexto','Relacionar el concepto con una situación y justificarlo','Memorizar una palabra','Elegir al azar'],1],[`Ante una situación relacionada con ${topic}, conviene:`,['Analizar datos y contexto','Ignorar información','Copiar una respuesta','Responder sin justificar'],0]]};}
function yt(area,topic,grade){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(area+' '+topic+' '+grade+' explicación clase español');}
function imgFor(area,topic){const map={Matemáticas:'https://images.unsplash.com/photo-1596495578068-9d0e3b8a3a91?auto=format&fit=crop&w=1200&q=80',Biología:'https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=1200&q=80',Sociales:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?auto=format&fit=crop&w=1200&q=80',Castellano:'https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=1200&q=80',Inglés:'https://images.unsplash.com/photo-1529070538774-1843cb3265df?auto=format&fit=crop&w=1200&q=80',Filosofía:'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1200&q=80',Física:'https://images.unsplash.com/photo-1636466497217-26a8cbeaf0aa?auto=format&fit=crop&w=1200&q=80',Química:'https://images.unsplash.com/photo-1532634922-8fe0b757fb13?auto=format&fit=crop&w=1200&q=80'};return map[area]}
function render(view='home'){const app=document.getElementById('app');if(view==='home')home(app);if(view==='areas')areas(app);if(view==='evaluaciones')evaluaciones(app)}
function home(app){app.innerHTML=`<section class="hero"><div><span class="chip">8° · 9° · 10° · 11°</span><h1>Rincón Académico</h1><p>Clases completas para comprender, practicar y prepararse para evaluaciones. Cada tema tiene explicación conceptual, aplicación, recursos audiovisuales y preguntas específicas del área.</p><div class="chips"><span class="chip">📚 Lecciones</span><span class="chip">🖼️ Recursos visuales</span><span class="chip">🎥 Videos por tema</span><span class="chip">🧠 ICFES</span></div><button class="btn primary" onclick="render('areas')">Explorar áreas</button></div><img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80" alt="Estudiantes aprendiendo"></section><section class="section"><h2>Una lección completa, no una definición aislada</h2><p class="muted">Selecciona el grado y el área. El contenido cambia de profundidad entre 8°-9° y 10°-11°. Las prácticas se construyen sobre el tema estudiado.</p><div class="grid">${AREAS.map(a=>`<article class="card area-card" onclick="area('${a.id}')"><div class="icon">${a.icon}</div><h3>${a.name}</h3><p class="muted">${a.desc}</p></article>`).join('')}</div></section>`}
function areas(app){app.innerHTML=`<section class="section"><h1>Áreas académicas</h1><p class="muted">Primero elige el área y después el grado. No hay un único contenido genérico para todos los cursos.</p><div class="grid">${AREAS.map(a=>`<article class="card area-card" onclick="area('${a.id}')"><div class="icon">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p><button class="btn primary">Ver temas</button></article>`).join('')}</div></section>`}
function area(id){const a=AREAS.find(x=>x.id===id);document.getElementById('app').innerHTML=`<button class="btn back" onclick="render('areas')">← Volver a áreas</button><section class="lesson"><img src="${a.img}" alt="${a.name}"><h1>${a.icon} ${a.name}</h1><p class="muted">${a.desc}</p><h2>Elige el nivel</h2><div class="grade-grid">${GRADES.map(g=>`<button class="grade-card" onclick="topics('${a.id}','${encodeURIComponent(g)}')"><strong>${g}</strong><span>${g==='8°-9°'?'Fundamentación y aplicación':'Profundización, análisis e ICFES'}</span></button>`).join('')}</div></section>`}
function topics(id,g){const a=AREAS.find(x=>x.id===id),grade=decodeURIComponent(g);document.getElementById('app').innerHTML=`<button class="btn back" onclick="area('${id}')">← Cambiar nivel</button><section class="section"><span class="chip">${grade}</span><h1>${a.icon} ${a.name}</h1><p class="muted">Selecciona un tema. Cada uno contiene una explicación desarrollada y una práctica específica.</p><div class="topics">${a.topics.map(t=>`<div class="topic" onclick="lesson('${a.id}','${encodeURIComponent(t)}','${encodeURIComponent(grade)}')"><strong>${t}</strong><p class="muted">Clase completa · ejemplos · actividad · video · preguntas del tema</p></div>`).join('')}</div></section>`}
function lesson(id,te,ge){const a=AREAS.find(x=>x.id===id),topic=decodeURIComponent(te),grade=decodeURIComponent(ge),d=getLesson(a.name,topic,grade);document.getElementById('app').innerHTML=`<button class="btn back" onclick="topics('${id}','${encodeURIComponent(grade)}')">← Volver a temas</button><article class="lesson"><div class="lesson-head"><img src="${imgFor(a.name,topic)}" alt="Imagen educativa de ${topic}"><div><span class="chip">${grade}</span><h1>${topic}</h1><p class="muted">${a.name} · Docente Belkis Alvarez</p></div></div><h2>1. Explicación del tema</h2><p>${d.concept}</p><h3>Desarrollo conceptual</h3><p>${d.deep}</p><h3>Ejemplos</h3>${d.examples.map(e=>`<div class="example">${e}</div>`).join('')}<div class="notice"><strong>Actividad de aplicación</strong><p>${d.activity}</p></div><div class="notice"><strong>Enfoque para ${grade}</strong><p>${GENERIC[grade]}</p></div><h2>🎥 Videos relacionados con este tema</h2><p>En lugar de un video genérico, aquí se abre una búsqueda específica de <strong>${a.name} · ${topic} · ${grade}</strong> para que el estudiante encuentre explicaciones audiovisuales directamente relacionadas.</p><a class="btn primary" href="${yt(a.name,topic,grade)}" target="_blank" rel="noopener">▶ Ver videos de ${topic} en YouTube</a><h2>🧠 Comprueba tus conocimientos</h2><p class="muted">Preguntas construidas para evaluar la comprensión y aplicación del contenido de esta lección. El enfoque ICFES privilegia situaciones en las que se aplican conocimientos y se interpretan evidencias. </p>${d.qs.map((x,i)=>`<div class="question"><strong>${i+1}. ${x[0]}</strong>${x[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" onclick="gradeLesson('${a.name}','${encodeURIComponent(topic)}','${encodeURIComponent(grade)}',${d.qs.length})">Calificar práctica</button><div id="lessonResult"></div></article>`}
function gradeLesson(area,te,ge,n){const topic=decodeURIComponent(te),grade=decodeURIComponent(ge),d=getLesson(area,topic,grade);let s=0;d.qs.forEach((x,i)=>{const el=document.querySelector(`input[name=q${i}]:checked`);if(el&&+el.value===x[2])s++});const score=Math.round(s/n*100);document.getElementById('lessonResult').innerHTML=`<div class="result"><div class="score">${score}/100</div><strong>${score>=70?'Buen trabajo':'Necesitas reforzar el tema'}</strong><p>${s} de ${n} respuestas correctas. Relee la explicación y vuelve a intentarlo.</p></div>`}
function evaluaciones(app){app.innerHTML=`<section class="section"><h1>📝 Exámenes por área</h1><p class="muted">Cada examen se genera con preguntas del contenido específico del área. Selecciona nivel y área.</p><div class="grid">${AREAS.map(a=>`<article class="card"><div class="icon">${a.icon}</div><h3>${a.name}</h3><div class="grade-grid small">${GRADES.map(g=>`<button class="grade-card" onclick="exam('${a.id}','${encodeURIComponent(g)}')">${g}<span>10 preguntas</span></button>`).join('')}</div></article>`).join('')}</div></section>`}
function exam(id,ge){const a=AREAS.find(x=>x.id===id),grade=decodeURIComponent(ge);let items=[];a.topics.forEach(t=>{const d=getLesson(a.name,t,grade);d.qs.forEach((x,i)=>items.push({q:x[0],opts:x[1],c:x[2],topic:t}))});items=items.slice(0,10);document.getElementById('app').innerHTML=`<button class="btn back" onclick="render('evaluaciones')">← Volver a evaluaciones</button><article class="lesson"><span class="chip">${grade}</span><h1>${a.icon} Examen de ${a.name}</h1><p class="muted">10 preguntas · selección múltiple · calificación automática</p>${items.map((x,i)=>`<div class="question"><small>${x.topic}</small><p><strong>${i+1}. ${x.q}</strong></p>${x.opts.map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" onclick='gradeExam(${JSON.stringify(items)},${JSON.stringify(a.name)})'>Finalizar y calificar</button><div id="examResult"></div></article>`}
function gradeExam(items,area){let s=0;items.forEach((x,i)=>{const el=document.querySelector(`input[name=e${i}]:checked`);if(el&&+el.value===x.c)s++});const score=Math.round(s/items.length*100);document.getElementById('examResult').innerHTML=`<div class="result"><div class="score">${score}/100</div><strong>${score>=70?'Aprobado':'Necesita refuerzo'}</strong><p>${s} de ${items.length} respuestas correctas en ${area}.</p></div>`}
function init(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.view));render('home')}init();

</script></body></html>
